name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head -20

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ControlYourFlow.xcodeproj \
            -scheme Flow \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-test.log | grep -E "(error:|warning: .*Flow/|✔|✘|Test run|passed|failed|\*\* TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ControlYourFlow.xcodeproj \
            -scheme Flow \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Flow.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package .ipa
        run: |
          APP="build/Flow.xcarchive/Products/Applications/Flow.app"
          test -d "$APP"
          if [ -d "$APP/Metadata.appintents" ]; then
            echo "App Intents metadata present"
          else
            echo "::warning::Metadata.appintents missing (expected until the App Intent exists)"
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Flow.ipa Payload)
          ls -lh build/Flow.ipa

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build-test.log
            build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Flow-ipa
          path: build/Flow.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Flow.ipa \
            --title "Flow $GITHUB_REF_NAME" \
            --notes "Unsigned build for sideloading (SideStore/AltStore). See README."
